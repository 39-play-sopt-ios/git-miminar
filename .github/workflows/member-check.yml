name: 참석자 PR 검사

on:
  pull_request:
    branches: [main]
    # edited: PR 본문(Closes #번호)을 고치면 다시 검사
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 이슈 번호, Closes, 바꾼 파일, 충돌 마커, 내 블록 확인
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # 진행자가 충돌을 일으키려고 여는 PR(host/ 브랜치)은 검사하지 않는다
          case "$BRANCH" in host/*) echo "진행자 PR이라 건너뜁니다."; exit 0 ;; esac
          ./scripts/check-member-pr.sh "$BASE_SHA" "$AUTHOR" "$BRANCH" "$BODY"
